[package]
name = "jackdaw_widgets_runtime"
version.workspace = true
edition = "2024"
description = "Load-time defaults and value behaviour for authored Bevy UI widgets"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jbuehler23/jackdaw"

[dependencies]
smol_str = { version = "0.2", default-features = false }
bevy = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false, features = [
    "std",
    "reflect_auto_register",
    "bevy_ui",
    "bevy_ui_widgets",
    "bevy_log",
    # `TextureSlicer`, which names the nine slices of a nine-patch image.
    # `bevy_ui` already depends on the crate; this only puts the type in reach.
    "bevy_sprite",
] }

[features]
default = []
# The feathers styling surface: the theme markers an authored widget carries
# and the hover state its button styling reads. Stays optional so a headless
# game keeps a smaller build.
# `bevy_feathers_core`, NOT `bevy_feathers`: the latter adds the two UiMaterials
# (the alpha checkerboard and the colour plane gradient) and with them
# bevy_render. Cargo unifies features workspace-wide, so naming the render half
# here would put wgpu back in the editor no matter what the root manifest says.
# `bevy_scene` comes with it: the widgets built out of more than one entity
# are spawned from the feathers scene components, and `spawn_scene` is what
# spawns one.
feathers = ["bevy/bevy_feathers_core", "bevy/bevy_picking", "bevy/bevy_scene"]

[lints]
workspace = true
