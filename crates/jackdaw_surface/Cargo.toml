[package]
name = "jackdaw_surface"
version.workspace = true
edition = "2024"
description = "Internal crate for the jackdaw editor"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jbuehler23/jackdaw"

[dependencies]
bevy_aurora.workspace = true
bevy = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false, features = [
    "std",
    "bevy_asset",
    "bevy_image",
    "bevy_log",
] }
jackdaw_scene_types = { version = "0.19.0", path = "../jackdaw_scene_types", default-features = false }
# Same versions aurora links: the surface group's parameter row is written through
# aurora's buffer API and read by its shader.
ash = { version = "0.38.0", features = ["linked"] }
bytemuck = { version = "1.14.3", features = ["derive"] }

[lints]
workspace = true
