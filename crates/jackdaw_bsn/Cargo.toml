[package]
name = "jackdaw_bsn"
version.workspace = true
edition = "2024"
description = "Internal crate for the jackdaw editor"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jbuehler23/jackdaw"

[dependencies]
bevy = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false, features = ["std", "bevy_asset", "bevy_scene"] }
log = "0.4"
thiserror = "2"

[dev-dependencies]
# The round-trip test needs a real vocabulary of its own, not a synthetic
# stand-in: `Bindings` is the list-of-enums shape the read path is weakest on.
jackdaw_bind.workspace = true
# A definition type's files are round-tripped through a real directory.
tempfile = "3"

[lints]
workspace = true
