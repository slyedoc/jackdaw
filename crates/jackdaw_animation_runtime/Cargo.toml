[package]
name = "jackdaw_animation_runtime"
version.workspace = true
edition = "2024"
description = "Plays bevy_animation_graph graphs on authored rigs and fires clip events"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jbuehler23/jackdaw"

[dependencies]
bevy = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false, features = [
    "std",
    "bevy_animation",
    "bevy_asset",
    "bevy_log",
] }
# The graph, state machine and clip assets, and the player that evaluates them.
bevy_animation_graph = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true
