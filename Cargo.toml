[package]
name = "jackdaw"
version.workspace = true
edition = "2024"
description = "A 3D level editor built with Bevy"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jbuehler23/jackdaw"
readme = "README.md"
keywords = ["bevy", "editor", "3d", "level-editor"]
categories = ["game-development", "graphics"]
# Ship only what the published crate needs: library source, the
# assets referenced by `embedded_asset!` (env maps + grid texture),
# manifest, license, README, templates, and small logos. Everything else
# in the repo (book/, docs/,
# demo assets in `assets/jan/`, `assets/models/`, etc.) is for
# source-checkout development and stays out of the .crate so it fits
# under crates.io's 10 MiB upload limit.
include = [
    "src/**/*.rs",
    "templates/**/*",
    "assets/environment_maps/**/*",
    "assets/logo/jackdaw_icon_small.png",
    "assets/logo/jackdaw_icon_pride_small.png",
    "assets/textures/jd_grid.png",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]
# The package now ships two binaries: `jackdaw` (the editor) and
# `jackdaw-rustc-wrapper` (the rustc interceptor used by scaffolded
# extension projects). `default-run` makes `cargo run` resolve to the
# editor without an explicit `--bin` flag; the wrapper still builds
# alongside via `cargo build` and is installed by `cargo install`.
default-run = "jackdaw"

[features]
# Source and `cargo install` builds are self-contained by default.
# Cargo only installs executables, so enabling Bevy's dynamic-linking
# feature here would leave the installed editor without its required
# SDK dylib. Release builds explicitly enable `dylib` after staging the
# matching SDK beside the editor.
default = ["multiplayer", "camera_rig", "embed-recipe"]
# Bundles the editor-only networking authoring extension into the
# editor: registers the proxy reflection types (`Replication`,
# `NetworkRoom`) plus the user-toggleable networking extension. The
# editor authors networking metadata only - no lightyear is compiled
# into the editor; the lightyear backend lives game-side. On by
# default; opt out with `--no-default-features` for a slimmer build.
multiplayer = ["dep:jackdaw_multiplayer", "dep:jackdaw_multiplayer_editor"]
camera_rig = ["dep:jackdaw_camera_rig"]
# The SDK-backed extension flow: builds the SDK facade plus separate Bevy
# and Jackdaw runtime dylibs. The editor and every loaded extension import
# those same libraries so TypeIds and process-wide registries cross
# `dlopen`. Games do not use this path; they build as ordinary cargo
# binaries with their own Bevy. Off by default only because building the
# SDK slows plain dev builds; release editor builds enable it.
#
# Build with CARGO_INCREMENTAL=0: incremental codegen leaves undefined
# hidden anon constants across the dylib boundary at link time.
dylib = ["dep:jackdaw_sdk", "jackdaw_api/dynamic_linking", "jackdaw_project_build/reflect"]
# Bake the SDK-builder recipe into the editor binary so a self-contained
# Cargo install can build its SDK on first launch (the first-run setup
# screen). Enabled by default; release bundles already carry a built SDK.
embed-recipe = ["jackdaw_project_build/embed-recipe"]

[workspace]
members = [
    "crates/*",
    "examples/extension/dynamic_extension",
    "examples/extension/viewable_camera_extension",
    "tests/fixtures/test_fixture_extension",
]
# Its lightyear 0.28 stack pins crates.io bevy 0.19, which would put a SECOND bevy in the
# graph. Nothing depends on this crate; restore it when lightyear reaches bevy main.
exclude = ["crates/jackdaw_multiplayer_lightyear"]

[dependencies]
bevy = { workspace = true, features = ["system_font_discovery"] }
jackdaw_jsn.workspace = true
jackdaw_bsn.workspace = true
jackdaw_prefab.workspace = true
# Types only: the editor registers the binding components so they are
# authorable and round-trip through BSN. `JackdawBindPlugin` (evaluator
# + observers) stays out of the editor world; bindings run in the game.
jackdaw_bind.workspace = true
jackdaw_geometry.workspace = true
jackdaw_scene_types.workspace = true
jackdaw_schema.workspace = true
jackdaw_project_build.workspace = true
jackdaw_csg.workspace = true
bevy_monitors.workspace = true
bevy_window_chrome.workspace = true
jackdaw_camera.workspace = true
jackdaw_feathers.workspace = true
jackdaw_widgets.workspace = true
jackdaw_widgets_runtime = { workspace = true, features = ["feathers"] }
jackdaw_commands.workspace = true
jackdaw_terrain.workspace = true
jackdaw_remote.workspace = true
jackdaw_snap.workspace = true
jackdaw_select.workspace = true
jackdaw_uv.workspace = true
jackdaw_pick.workspace = true
jackdaw_hull.workspace = true
jackdaw_material.workspace = true
jackdaw_surface.workspace = true
jackdaw_node_graph.workspace = true
jackdaw_animation.workspace = true
jackdaw_animation_runtime.workspace = true
jackdaw_avian_integration.workspace = true
# Optional, activated by the default-on `multiplayer` feature. Together
# these bundle the editor-only networking authoring extension (proxy
# reflection types + the toggleable networking extension) into the
# editor; no lightyear is compiled into the editor. Gated so
# `--no-default-features` produces a slimmer build.
jackdaw_multiplayer = { workspace = true, optional = true }
jackdaw_multiplayer_editor = { workspace = true, optional = true }
jackdaw_camera_rig = { workspace = true, optional = true }
jackdaw_panels.workspace = true
jackdaw_api.workspace = true
# The editor crate uses `jackdaw_api` the same way third-party
# extension authors do, and reaches into `jackdaw_api_internal` only
# for host-side plumbing (loader plugin, catalog, enable/disable
# helpers, internal component markers) that `jackdaw_api` deliberately
# doesn't re-export.
jackdaw_api_internal.workspace = true
jackdaw_loader.workspace = true
# `jackdaw_runtime` hosts the standalone scene loader plus the
# `EditorMeta`/`ReflectEditorMeta` trait that user game crates
# implement. The editor depends on it (rather than the other way
# around) so the trait is reachable from a game crate that only
# pulls in `jackdaw_runtime` and never compiles the editor.
jackdaw_runtime.workspace = true
# Process-based Play: the editor spawns the project's game binary and
# drives it over ipc-channel. The protocol's `ipc` transport is light
# enough to be unconditional, so Play always works in the editor with
# no per-build feature gate.
jackdaw_pie_protocol = { path = "crates/jackdaw_pie_protocol", features = [
    "ipc",
] }
# Optional and activated only by the `dylib` feature. Nothing in
# the editor's own Rust code imports `jackdaw_sdk` - it's a pure
# build artifact consumed at runtime by the extension build
# pipeline (`SdkPaths::compute` / `ext_build`), which already
# handles a missing SDK with a user-actionable error. Keeping it
# optional means default `cargo build` doesn't try to link
# `jackdaw_sdk.dll` on Windows, where the dylib's re-exports
# would otherwise blow past the 65,535 PE export cap. See issue #183.
jackdaw_sdk = { workspace = true, optional = true }
# The wrapper's logic also lives in this crate's `[[bin]]` so that
# `cargo install jackdaw` ships `jackdaw-rustc-wrapper` next to the
# editor binary. Both binaries call into the same library entry
# point. For dev builds running from a source checkout the standalone
# wrapper crate's `[[bin]]` is also available; either path works at
# runtime.
jackdaw_rustc_wrapper.workspace = true
jackdaw_cli_internal.workspace = true
bevy_enhanced_input.workspace = true
serde.workspace = true
serde_json.workspace = true
avian3d.workspace = true
rfd.workspace = true
bevy_rerecast.workspace = true
ehttp.workspace = true
base64.workspace = true
anyhow.workspace = true
arboard = { version = "3", features = ["wayland-data-control"] }
dirs.workspace = true
regex.workspace = true
pathdiff.workspace = true
path-slash.workspace = true
dunce = "1.0.5"
notify = "8"
ctrlc = "3"
toml = "0.8"
# Format-preserving TOML edits for `jd import` (existing-project integration).
toml_edit = "0.22"
# Compare a project's declared bevy requirement against the supported
# minor properly: a textual prefix test both accepts `0.190` and rejects
# a compatible range like `>=0.19, <0.21`.
semver = "1"
# Embed the project templates into the binary so `jd new` scaffolds
# offline with no cargo-generate dependency.
include_dir = "0.7"
# Parse + rewrite a project's `main.rs` when migrating a bin-only project into a
# `GamePlugin` library (`src/migrate.rs`). `span-locations` gives byte spans so
# moved item definitions are sliced verbatim (comments preserved); prettyplease
# formats only the synthetic `GamePlugin` impl we generate.
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
prettyplease = "0.2"
winit.workspace = true
image.workspace = true
time.workspace = true
jackdaw_localization = { version = "0.19.0", path = "crates/jackdaw_localization" }
jackdaw_env.workspace = true
webbrowser.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_JobObjects"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Powers the Linux `PR_SET_PDEATHSIG` hook that takes PIE game processes down
# with the editor when it is killed (`src/pie.rs`).
libc = "0.2"
# Match the version bevy_text/bevy_ui already pull through parley. At 0.9 this was a
# SECOND copy that nothing turned `std` on for, so its `read-fonts` lost the libm/std
# float methods and failed to build. Same version = features union with bevy's.
fontique = { version = "0.11", default-features = false, features = [
    "fontconfig-dlopen",
] }

# Every workspace crate inherits this version (`version.workspace = true`).
# It is anchored to Bevy's minor: 0.19.x targets Bevy 0.19, and bumps to
# 0.20.0 when the workspace moves to Bevy 0.20. Jackdaw's own patch number
# advances independently within a Bevy minor.
[workspace.package]
version = "0.19.0"

[workspace.dependencies]
# No default features: the defaults pull bevy_render and with it the whole wgpu
# stack, which aurora replaces. Everything below is render-free at this revision.
# `bevy_feathers_core` is feathers WITHOUT its two UiMaterials -- see aurora's
# ui_render, which rasterizes the bevy_ui tree on Vulkan instead.
# `bevy_dev_tools` is deliberately absent: it depends on bevy_render/bevy_pbr
# unconditionally, so the infinite grid and the fps overlay need aurora-side homes.
bevy = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false, features = [
    # aurora's baseline -- keep in step with zero's list.
    "default_app",
    "default_platform",
    "common_api",
    "std",
    "multi_threaded",
    "bevy_winit",
    "x11",
    "wayland",
    "scene",
    "serialize",
    "bevy_animation",
    "bevy_camera",
    "bevy_ui",
    "bevy_ui_widgets",
    "ui_picking",
    "bevy_input_focus",
    "bevy_feathers_core",
    "bevy_camera_controller",
    "free_camera",
    "bevy_light",
    "bevy_mesh",
    "bevy_mikktspace",
    "bevy_image",
    "bevy_color",
    "png",
    "ktx2",
    "zstd_rust",
    "default_font",
    # the editor's own
    "bevy_gltf",
    "gltf_animation",
    "bevy_gizmos",
    "bevy_audio",
    "bevy_remote",
    "bevy_world_serialization",
    "file_watcher",
    "reflect_auto_register",
    "reflect_documentation",
    "reflect_functions",
    "debug",
    "system_font_discovery",
] }
# `default-features = false` throughout: each of these crates defaults to a `render`
# feature that turns on bevy/bevy_render, and cargo unifies features across the whole
# workspace -- one of them left on puts wgpu back in every binary here.
jackdaw_jsn = { version = "0.19.0", path = "crates/jackdaw_jsn", default-features = false }
jackdaw_geometry = { version = "0.19.0", path = "crates/jackdaw_geometry", default-features = false }
jackdaw_scene_types = { version = "0.19.0", path = "crates/jackdaw_scene_types", default-features = false }
jackdaw_schema = { version = "0.19.0", path = "crates/jackdaw_schema" }
jackdaw_project_build = { version = "0.19.0", path = "crates/jackdaw_project_build" }
jackdaw_bsn = { version = "0.19.0", path = "crates/jackdaw_bsn" }
jackdaw_bind = { version = "0.19.0", path = "crates/jackdaw_bind" }
jackdaw_csg = { version = "0.19.0", path = "crates/jackdaw_csg" }
bevy_monitors = "0.3"
bevy_window_chrome = { version = "0.19.0", path = "crates/bevy_window_chrome" }
jackdaw_camera = { version = "0.19.0", path = "crates/jackdaw_camera" }
jackdaw_camera_rig = { version = "0.19.0", path = "crates/jackdaw_camera_rig" }
jackdaw_feathers = { version = "0.19.0", path = "crates/jackdaw_feathers" }
jackdaw_widgets = { version = "0.19.0", path = "crates/jackdaw_widgets" }
jackdaw_widgets_runtime = { version = "0.19.0", path = "crates/jackdaw_widgets_runtime", default-features = false }
jackdaw_commands = { version = "0.19.0", path = "crates/jackdaw_commands" }
jackdaw_terrain = { version = "0.19.0", path = "crates/jackdaw_terrain", default-features = false, features = ["procgen"] }
jackdaw_remote = { version = "0.19.0", path = "crates/jackdaw_remote" }
jackdaw_snap = { version = "0.19.0", path = "crates/jackdaw_snap" }
jackdaw_select = { version = "0.19.0", path = "crates/jackdaw_select" }
jackdaw_uv = { version = "0.19.0", path = "crates/jackdaw_uv" }
jackdaw_pick = { version = "0.19.0", path = "crates/jackdaw_pick" }
jackdaw_hull = { version = "0.19.0", path = "crates/jackdaw_hull" }
jackdaw_material = { version = "0.19.0", path = "crates/jackdaw_material" }
jackdaw_surface = { version = "0.19.0", path = "crates/jackdaw_surface" }
jackdaw_node_graph = { version = "0.19.0", path = "crates/jackdaw_node_graph" }
jackdaw_animation = { version = "0.19.0", path = "crates/jackdaw_animation" }
jackdaw_animation_runtime = { version = "0.19.0", path = "crates/jackdaw_animation_runtime" }
jackdaw_fuzzy = { version = "0.19.0", path = "crates/jackdaw_fuzzy" }
jackdaw_localization = { version = "0.19.0", path = "crates/jackdaw_localization" }
glam = { version = "0.33", features = ["serde"] }
noise = "0.9"
rand = "0.10"
serde = "1"
lucide-icons = "0.563"
serde_json = "1"
# Default features stay on so the SDK resolves at least what an extension
# does: a physics-enabled graph adds a plain `avian3d = "0.7"`, and against an
# SDK built leaner, any use of an item behind one of the dropped
# features fails to compile against the redirected rlib.
# `tests/sdk_feature_superset.rs` guards that ordering.
avian3d = { git = "https://github.com/avianphysics/avian", branch = "main", features = [
    "3d",
    "parry-f32",
    "collider-from-mesh",
] }
jackdaw_avian_integration = { version = "0.19.0", path = "crates/jackdaw_avian_integration" }
jackdaw_multiplayer = { version = "0.19.0", path = "crates/jackdaw_multiplayer" }
jackdaw_multiplayer_editor = { version = "0.19.0", path = "crates/jackdaw_multiplayer_editor" }
jackdaw_runtime = { version = "0.19.0", path = "crates/jackdaw_runtime", default-features = false }
jackdaw_panels = { version = "0.19.0", path = "crates/jackdaw_panels" }
jackdaw_prefab = { version = "0.19.0", path = "crates/jackdaw_prefab" }
jackdaw_api = { version = "0.19.0", path = "crates/jackdaw_api" }
jackdaw_extension = { version = "0.19.0", path = "crates/jackdaw_extension" }
jackdaw_api_internal = { version = "0.19.0", path = "crates/jackdaw_api_internal" }
jackdaw_api_macros = { version = "0.19.0", path = "crates/jackdaw_api_macros" }
jackdaw_dylib = { version = "0.19.0", path = "crates/jackdaw_dylib" }
jackdaw_loader = { version = "0.19.0", path = "crates/jackdaw_loader" }
jackdaw_sdk = { version = "0.19.0", path = "crates/jackdaw_sdk" }
jackdaw_rustc_wrapper = { version = "0.19.0", path = "crates/jackdaw_rustc_wrapper" }
jackdaw_cli_internal = { version = "0.19.0", path = "crates/jackdaw_cli" }
jackdaw_env = { version = "0.19.0", path = "crates/jackdaw_env" }
bevy_enhanced_input = "0.26"
rfd = "0.15"
# Default features include `editor_integration`, whose crate depends on bevy_render.
# `bevy_mesh` is what provides `TriMeshFromBevyMesh` (the navmesh bake reads Mesh3d);
# `debug_plugin` is the gizmo overlay.
bevy_rerecast = { version = "0.5.0", default-features = false, features = [
    "bevy_mesh",
    "debug_plugin",
] }
# The renderer. Named by its upstream url like every other fork here; the
# `[patch]` section below swaps in the side-by-side checkout at ../../p/aurora.
bevy_aurora = { git = "https://github.com/slyedoc/aurora.git", branch = "main" }
ehttp = { version = "0.5", default-features = false, features = [
    "native-async",
    "json",
] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
anyhow = { version = "1", default-features = false }
dirs = "6"
regex = "1"
pathdiff = "0.2"
path-slash = "0.2.1"
tracing = "0.1"
tracing-subscriber = "0.3"
winit = "0.30.13"
image = { version = "0.25.10", default-features = false, features = ["png"] }
time = { version = "0.3.47", default-features = false, features = [
    "std",
    "local-offset",
    "formatting",
    # Read back the RFC 3339 stamps we write, so the launcher can show
    # how long ago a project was last opened.
    "parsing",
] }
fluent = "0.16"
webbrowser = "1"
fluent_content = "0.0.5"
unic-langid = { version = "0.9", features = ["macros"] }
sys-locale = "0.2"
windows = "0.61.3"

# Idiomatic Bevy code often triggers these lints, and the CI workflow treats them as errors.
[workspace.lints.clippy]
doc_markdown = "warn"

redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
unwrap_or_default = "warn"
disallowed_methods = "warn"
needless_lifetimes = "allow"
too_many_arguments = "allow"
nonstandard_macro_braces = "warn"
print_stdout = "warn"

ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"

# see: https://github.com/bevyengine/bevy/pull/15375#issuecomment-2366966219
too_long_first_doc_paragraph = "allow"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"
match_same_arms = "warn"
manual_let_else = "warn"
print_stderr = "warn"
redundant_closure_for_method_calls = "warn"

# TODO: enable these if you have time!
# undocumented_unsafe_blocks = "warn"

[dev-dependencies]
bevy.workspace = true
# `examples/load_terrain_world.rs` draws an authored terrain, loads its bake and
# stands a body on the ground, which needs both runtime features.
jackdaw_runtime = { workspace = true, features = ["terrain", "physics"] }
libloading = "0.8"
serde_json.workspace = true
tempfile = "3"
path-slash.workspace = true
# Pulled in so cargo builds the fixture cdylib as part of the
# workspace test-target graph. `tests/dylib_loading.rs` dlopens the
# resulting `.so` by path - it doesn't reference the rlib side.
test_fixture_extension = { path = "tests/fixtures/test_fixture_extension" }

# Plain test targets on Linux and macOS use the same split runtime as release
# builds. This avoids statically relinking the multi-gigabyte editor graph for
# small integration tests. Windows enables the split explicitly in the SDK and
# release jobs, where its full DLL graph and export counts are exercised.
[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
bevy = { workspace = true, features = ["dynamic_linking"] }
jackdaw_api = { workspace = true, features = ["dynamic_linking"] }

[lints]
workspace = true

###############################################################################
# Fork redirects. Manifests name each crate's UPSTREAM url; these swap in the
# side-by-side checkouts, so the whole graph lands on ONE copy of bevy. Same
# table zero and aurora_files carry -- keep them in step.
###############################################################################

[patch."https://github.com/bevyengine/bevy"]
bevy = { path = "../bevy" }
bevy_a11y = { path = "../bevy/crates/bevy_a11y" }
bevy_android = { path = "../bevy/crates/bevy_android" }
bevy_animation = { path = "../bevy/crates/bevy_animation" }
bevy_anti_alias = { path = "../bevy/crates/bevy_anti_alias" }
bevy_app = { path = "../bevy/crates/bevy_app" }
bevy_asset = { path = "../bevy/crates/bevy_asset" }
bevy_audio = { path = "../bevy/crates/bevy_audio" }
bevy_camera = { path = "../bevy/crates/bevy_camera" }
bevy_camera_controller = { path = "../bevy/crates/bevy_camera_controller" }
bevy_clipboard = { path = "../bevy/crates/bevy_clipboard" }
bevy_color = { path = "../bevy/crates/bevy_color" }
bevy_core_pipeline = { path = "../bevy/crates/bevy_core_pipeline" }
bevy_derive = { path = "../bevy/crates/bevy_derive" }
bevy_dev_tools = { path = "../bevy/crates/bevy_dev_tools" }
bevy_diagnostic = { path = "../bevy/crates/bevy_diagnostic" }
bevy_dylib = { path = "../bevy/crates/bevy_dylib" }
bevy_ecs = { path = "../bevy/crates/bevy_ecs" }
bevy_encase_derive = { path = "../bevy/crates/bevy_encase_derive" }
bevy_extract = { path = "../bevy/crates/bevy_extract" }
bevy_feathers = { path = "../bevy/crates/bevy_feathers" }
bevy_feathers_inspector = { path = "../bevy/crates/bevy_feathers_inspector" }
bevy_gilrs = { path = "../bevy/crates/bevy_gilrs" }
bevy_gizmos = { path = "../bevy/crates/bevy_gizmos" }
bevy_gizmos_render = { path = "../bevy/crates/bevy_gizmos_render" }
bevy_gltf = { path = "../bevy/crates/bevy_gltf" }
bevy_image = { path = "../bevy/crates/bevy_image" }
bevy_input = { path = "../bevy/crates/bevy_input" }
bevy_input_focus = { path = "../bevy/crates/bevy_input_focus" }
bevy_internal = { path = "../bevy/crates/bevy_internal" }
bevy_light = { path = "../bevy/crates/bevy_light" }
bevy_log = { path = "../bevy/crates/bevy_log" }
bevy_macro_utils = { path = "../bevy/crates/bevy_macro_utils" }
bevy_material = { path = "../bevy/crates/bevy_material" }
bevy_math = { path = "../bevy/crates/bevy_math" }
bevy_mesh = { path = "../bevy/crates/bevy_mesh" }
bevy_pbr = { path = "../bevy/crates/bevy_pbr" }
bevy_picking = { path = "../bevy/crates/bevy_picking" }
bevy_platform = { path = "../bevy/crates/bevy_platform" }
bevy_post_process = { path = "../bevy/crates/bevy_post_process" }
