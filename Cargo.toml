bevy_ui = { git = "https://github.com/slyedoc/bevy", branch = "aurora" }
bevy_ui_widgets = { git = "https://github.com/slyedoc/bevy", branch = "aurora" }
bevy_utils = { git = "https://github.com/slyedoc/bevy", branch = "aurora" }
bevy_window = { git = "https://github.com/slyedoc/bevy", branch = "aurora" }
bevy_winit = { git = "https://github.com/slyedoc/bevy", branch = "aurora" }
bevy_world_serialization = { git = "https://github.com/slyedoc/bevy", branch = "aurora" }

[patch."https://github.com/avianphysics/avian"]
avian3d = { git = "https://github.com/slyedoc/avian", branch = "aurora" }

# Taken by crates.io version here; the fork branches satisfy those requirements.
[patch.crates-io]
avian3d = { git = "https://github.com/slyedoc/avian", branch = "aurora" }
bevy_enhanced_input = { git = "https://github.com/slyedoc/bevy_enhanced_input", branch = "bevy-main" }
bevy_rerecast = { git = "https://github.com/slyedoc/rerecast", branch = "bevy-main" }
bevy_rerecast_core = { git = "https://github.com/slyedoc/rerecast", branch = "bevy-main" }
bevy_monitors = { git = "https://github.com/slyedoc/bevy_monitors", branch = "bevy-main" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.wgpu-types]
debug-assertions = false


# No LTO at all: thin LTO only served the SDK dylib's PE export ceiling and this branch builds
# without `dylib`. `"off"` also skips the crate-local thin-LTO pass `false` still runs, which was
# ~40 s of every rebuild of the editor crate.
[profile.release]
lto = "off"

