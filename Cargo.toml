avian3d = { git = "https://github.com/slyedoc/avian", branch = "aurora" }

# Taken by crates.io version here; the fork branches satisfy those requirements.
[patch.crates-io]
avian3d = { git = "https://github.com/slyedoc/avian", branch = "aurora" }
bevy_enhanced_input = { git = "https://github.com/slyedoc/bevy_enhanced_input", branch = "bevy-main" }
bevy_rerecast = { git = "https://github.com/slyedoc/rerecast", branch = "bevy-main" }
bevy_rerecast_core = { git = "https://github.com/slyedoc/rerecast", branch = "bevy-main" }
bevy_monitors = { git = "https://github.com/slyedoc/bevy_monitors", branch = "bevy-main" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.wgpu-types]
debug-assertions = false

# Keep the SDK facade compact. Bevy and Jackdaw's runtime closure live in
# their own dylibs; this crate should never approach the PE export ceiling.
[profile.dev.package.jackdaw_sdk]
opt-level = 3
codegen-units = 1

[profile.release]
# `codegen-units` is deliberately left at the default here. The PE export ceiling is served
# by the per-package setting on `jackdaw_sdk` below plus this `lto`; forcing every crate in
# the tree to a single codegen unit only serialises the build -- it held a 32-core machine
# at under 20% utilisation.
lto = "thin"

# Same rationale as `[profile.dev.package.jackdaw_sdk]`. `lto` isn't
# a valid per-package option (it controls the final link), so we only
# tighten codegen-units here; the workspace-wide `[profile.release]
# lto = "thin"` covers the cross-crate dedup that actually helps the
# PE export cap.
[profile.release.package.jackdaw_sdk]
codegen-units = 1

# Thin shim that re-exports `jackdaw_rustc_wrapper::run()`. We turn
# off doc generation because rustdoc's output path collides with the
# `jackdaw_rustc_wrapper` lib crate's docs (cargo translates dashes
# to underscores), and the shim has nothing user-facing to document
# anyway.
[[bin]]
name = "jackdaw-rustc-wrapper"
path = "src/bin/jackdaw-rustc-wrapper.rs"
doc = false

[[bin]]
name = "jd"
path = "src/bin/jd.rs"
doc = false
